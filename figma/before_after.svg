<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="Inter, Helvetica, Arial, sans-serif"><rect width="1440" height="900" fill="#ffffff"/><text x="64" y="72" font-size="13" fill="#0f766e" font-weight="700" text-anchor="start" letter-spacing="2">BEFORE / AFTER</text><text x="64" y="116" font-size="34" fill="#14213d" font-weight="700" text-anchor="start">Assignment 3 collected the data. Assignment 4 acts on it.</text><rect x="64" y="150" width="640" height="120" rx="10" fill="#f6f7f9" stroke="#e3e6ec" stroke-width="1"/><rect x="736" y="150" width="640" height="120" rx="10" fill="#e6f4f2" stroke="#b7dfd9" stroke-width="1"/><text x="88" y="186" font-size="13" fill="#6b7280" font-weight="700" text-anchor="start" letter-spacing="1.5">A3 · DATA PIPELINE</text><text x="760" y="186" font-size="13" fill="#0f766e" font-weight="700" text-anchor="start" letter-spacing="1.5">A4 · ACTION LAYER</text><text x="88" y="220.0" font-size="18" fill="#14213d" font-weight="600" text-anchor="start">Collects 285 clean records from 3 sources</text><text x="88" y="246.1" font-size="18" fill="#14213d" font-weight="600" text-anchor="start">into a CSV + quality report.</text><text x="760" y="220.0" font-size="18" fill="#14213d" font-weight="600" text-anchor="start">Turns each record into a decision and a real</text><text x="760" y="246.1" font-size="18" fill="#14213d" font-weight="600" text-anchor="start">action in HubSpot and Slack — in ~6 seconds.</text><line x1="64" y1="300" x2="1376" y2="300" stroke="#e3e6ec"/><text x="64" y="334" font-size="15" fill="#6b7280" font-weight="700" text-anchor="start">Intelligence</text><text x="240" y="334" font-size="15" fill="#2b2f38" font-weight="400" text-anchor="start">None — rules only (dedupe, date checks)</text><text x="736" y="334.0" font-size="15" fill="#14213d" font-weight="600" text-anchor="start">Claude routes every variant: channel fit, risk flags with</text><text x="736" y="355.0" font-size="15" fill="#14213d" font-weight="600" text-anchor="start">evidence, decision, owner, rewrite; a 2nd agent finds batch</text><text x="736" y="376.0" font-size="15" fill="#14213d" font-weight="600" text-anchor="start">patterns</text><line x1="64" y1="396" x2="1376" y2="396" stroke="#e3e6ec"/><text x="64" y="430" font-size="15" fill="#6b7280" font-weight="700" text-anchor="start">Output</text><text x="240" y="430" font-size="15" fill="#2b2f38" font-weight="400" text-anchor="start">CSV + JSON quality report</text><text x="736" y="430.0" font-size="15" fill="#14213d" font-weight="600" text-anchor="start">Slack alerts · HubSpot tasks · Gmail report · Google Sheet · HTML</text><text x="736" y="451.0" font-size="15" fill="#14213d" font-weight="600" text-anchor="start">report</text><line x1="64" y1="470" x2="1376" y2="470" stroke="#e3e6ec"/><text x="64" y="504" font-size="15" fill="#6b7280" font-weight="700" text-anchor="start">Trigger</text><text x="240" y="504" font-size="15" fill="#2b2f38" font-weight="400" text-anchor="start">Manual run, once</text><text x="736" y="504.0" font-size="15" fill="#14213d" font-weight="600" text-anchor="start">Webhook per event + daily scheduled digest</text><line x1="64" y1="526" x2="1376" y2="526" stroke="#e3e6ec"/><text x="64" y="560" font-size="15" fill="#6b7280" font-weight="700" text-anchor="start">Error handling</text><text x="240" y="560" font-size="15" fill="#2b2f38" font-weight="400" text-anchor="start">Retry + continue on fetch errors</text><text x="736" y="560.0" font-size="15" fill="#14213d" font-weight="600" text-anchor="start">Retries on every call · AI answer validator · fallback router ·</text><text x="736" y="581.0" font-size="15" fill="#14213d" font-weight="600" text-anchor="start">error workflow → Slack</text><line x1="64" y1="600" x2="1376" y2="600" stroke="#e3e6ec"/><text x="64" y="634" font-size="15" fill="#6b7280" font-weight="700" text-anchor="start">Duplicates</text><text x="240" y="634" font-size="15" fill="#2b2f38" font-weight="400" text-anchor="start">Removed after collection</text><text x="736" y="634.0" font-size="15" fill="#14213d" font-weight="600" text-anchor="start">Idempotency key blocks re-processing (0.19 s, $0)</text><line x1="64" y1="656" x2="1376" y2="656" stroke="#e3e6ec"/><text x="64" y="690" font-size="15" fill="#6b7280" font-weight="700" text-anchor="start">Scale evidence</text><text x="240" y="690" font-size="15" fill="#2b2f38" font-weight="400" text-anchor="start">1 run, 295 records</text><text x="736" y="690.0" font-size="15" fill="#14213d" font-weight="600" text-anchor="start">834 real requests up to 100 concurrent · 0 failures · ≈330/min</text><text x="736" y="711.0" font-size="15" fill="#14213d" font-weight="600" text-anchor="start">ceiling</text><line x1="64" y1="730" x2="1376" y2="730" stroke="#e3e6ec"/><text x="64" y="764" font-size="15" fill="#6b7280" font-weight="700" text-anchor="start">Cost visibility</text><text x="240" y="764" font-size="15" fill="#2b2f38" font-weight="400" text-anchor="start">—</text><text x="736" y="764.0" font-size="15" fill="#14213d" font-weight="600" text-anchor="start">$0.0044 per event, measured from token usage</text><line x1="64" y1="786" x2="1376" y2="786" stroke="#e3e6ec"/><text x="64" y="820" font-size="15" fill="#6b7280" font-weight="700" text-anchor="start">Human time</text><text x="240" y="820" font-size="15" fill="#2b2f38" font-weight="400" text-anchor="start">Still copy-paste into CRM</text><text x="736" y="820.0" font-size="15" fill="#14213d" font-weight="600" text-anchor="start">≈3.5 h saved per 50 variants</text><text x="64" y="882" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">Same 285 A3 records feed A4: ad copy = creative · campaigns = routing context · RSS = market context.</text></svg>