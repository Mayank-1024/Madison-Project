<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" font-family="Inter, Helvetica, Arial, sans-serif"><rect width="1440" height="1024" fill="#ffffff"/><text x="64" y="72" font-size="13" fill="#0f766e" font-weight="700" text-anchor="start" letter-spacing="2">MADISON AUTOMATION AGENT · ASSIGNMENT 4</text><text x="64" y="122" font-size="38" fill="#14213d" font-weight="700" text-anchor="start">The Action Layer: AI-routed handoff from content to CRM</text><text x="64" y="156" font-size="15" fill="#6b7280" font-weight="400" text-anchor="start">Executive summary · Mayank Bhadrasen · INFO7375 Branding &amp; AI · Oct 2026</text><rect x="1076" y="50" width="300" height="40" rx="20" fill="#14213d" stroke="#14213d" stroke-width="1"/><text x="1226" y="76" font-size="15" fill="#ffffff" font-weight="600" text-anchor="middle">Built with n8n + Claude Haiku 4.5</text><rect x="64" y="186" width="640" height="150" rx="10" fill="#f6f7f9" stroke="#e3e6ec" stroke-width="1"/><text x="88" y="218" font-size="12" fill="#0f766e" font-weight="700" text-anchor="start" letter-spacing="1.5">PROBLEM</text><text x="88" y="248.0" font-size="15.5" fill="#2b2f38" font-weight="400" text-anchor="start">Madison&#x27;s Content Agent writes quality-checked ad variants, but they</text><text x="88" y="270.475" font-size="15.5" fill="#2b2f38" font-weight="400" text-anchor="start">dead-end in a CSV and a chat ping. Marketers then spend ~10 hours a</text><text x="88" y="292.95" font-size="15.5" fill="#2b2f38" font-weight="400" text-anchor="start">week (26% of their time) on manual handoffs like copying content into</text><text x="88" y="315.425" font-size="15.5" fill="#2b2f38" font-weight="400" text-anchor="start">CRMs and notifying teams (DoubleVerify 2025, 1,970 marketers).</text><rect x="736" y="186" width="640" height="150" rx="10" fill="#f6f7f9" stroke="#e3e6ec" stroke-width="1"/><text x="760" y="218" font-size="12" fill="#0f766e" font-weight="700" text-anchor="start" letter-spacing="1.5">SOLUTION APPROACH</text><text x="760" y="248.0" font-size="15" fill="#2b2f38" font-weight="400" text-anchor="start">① Gatekeeper — validates, blocks bad payloads, stops duplicates (no AI)</text><text x="760" y="269.75" font-size="15" fill="#2b2f38" font-weight="400" text-anchor="start">② Routing Agent (Claude) — channel fit, risk flags, decision, owner, fix</text><text x="760" y="291.5" font-size="15" fill="#2b2f38" font-weight="400" text-anchor="start">③ Execution Agent — HubSpot task + Slack alert, retried and logged</text><text x="760" y="313.25" font-size="15" fill="#2b2f38" font-weight="400" text-anchor="start">④ Insights Agent (Claude) — batch patterns → email, Slack, Sheet</text><rect x="64" y="372" width="248" height="108" rx="10" fill="#ffffff" stroke="#e3e6ec" stroke-width="1"/><rect x="64" y="372" width="248" height="4" rx="2" fill="#0f766e"/><text x="84" y="428" font-size="32" fill="#14213d" font-weight="700" text-anchor="start">834</text><text x="84" y="458" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">requests in scale tests</text><rect x="329" y="372" width="248" height="108" rx="10" fill="#ffffff" stroke="#e3e6ec" stroke-width="1"/><rect x="329" y="372" width="248" height="4" rx="2" fill="#0f766e"/><text x="349" y="428" font-size="32" fill="#14213d" font-weight="700" text-anchor="start">0</text><text x="349" y="458" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">failed requests</text><rect x="594" y="372" width="248" height="108" rx="10" fill="#ffffff" stroke="#e3e6ec" stroke-width="1"/><rect x="594" y="372" width="248" height="4" rx="2" fill="#0f766e"/><text x="614" y="428" font-size="32" fill="#14213d" font-weight="700" text-anchor="start">$0.0044</text><text x="614" y="458" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">AI cost per event</text><rect x="859" y="372" width="248" height="108" rx="10" fill="#ffffff" stroke="#e3e6ec" stroke-width="1"/><rect x="859" y="372" width="248" height="4" rx="2" fill="#0f766e"/><text x="879" y="428" font-size="32" fill="#14213d" font-weight="700" text-anchor="start">6.4 s</text><text x="879" y="458" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">median live handoff</text><rect x="1124" y="372" width="248" height="108" rx="10" fill="#ffffff" stroke="#e3e6ec" stroke-width="1"/><rect x="1124" y="372" width="248" height="4" rx="2" fill="#0f766e"/><text x="1144" y="428" font-size="32" fill="#14213d" font-weight="700" text-anchor="start">≈330/min</text><text x="1144" y="458" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start">ceiling on a 1-vCPU VPS</text><text x="64" y="356" font-size="12" fill="#0f766e" font-weight="700" text-anchor="start" letter-spacing="1.5">CURRENT PERFORMANCE (measured 2026-10-09, Claude Haiku 4.5, n8n 2.12.3 on Hostinger KVM 1)</text><text x="64" y="548" font-size="12" fill="#0f766e" font-weight="700" text-anchor="start" letter-spacing="1.5">SAMPLE OUTPUTS</text><rect x="64" y="562" width="640" height="120" rx="10" fill="#1a1d21" stroke="#1a1d21" stroke-width="1"/><text x="86" y="592" font-size="13" fill="#9ca3af" font-weight="600" text-anchor="start">Slack · #campaign-review</text><text x="86" y="620.0" font-size="14.5" fill="#f3f4f6" font-weight="400" text-anchor="start">🟦 NORMAL · 👀 Needs review</text><text x="86" y="641.025" font-size="14.5" fill="#f3f4f6" font-weight="400" text-anchor="start">Alpha Innovations email variant needs subject line trim (87→60 chars).</text><text x="86" y="662.05" font-size="14.5" fill="#f3f4f6" font-weight="400" text-anchor="start">Copy is strong; fix headline length and we&#x27;re good to ship.</text><rect x="64" y="696" width="640" height="120" rx="10" fill="#fff4e5" stroke="#f3dfb5" stroke-width="1"/><text x="86" y="726" font-size="13" fill="#d97706" font-weight="700" text-anchor="start">Insights Agent · run report v2-50</text><text x="86" y="754.0" font-size="14.5" fill="#2b2f38" font-weight="400" text-anchor="start">“Channel mismatch was the top risk flag (16 of 50 variants). Embed</text><text x="86" y="775.025" font-size="14.5" fill="#2b2f38" font-weight="400" text-anchor="start">platform-specific format rules into the Content Agent prompt to cut</text><text x="86" y="796.05" font-size="14.5" fill="#2b2f38" font-weight="400" text-anchor="start">channel_mismatch flags from 32% to under 15%.”</text><text x="736" y="548" font-size="12" fill="#0f766e" font-weight="700" text-anchor="start" letter-spacing="1.5">RESULTS ACHIEVED (50 live variants)</text><rect x="736" y="562" width="640" height="54" rx="10" fill="#ffffff" stroke="#e3e6ec" stroke-width="1"/><text x="760" y="598" font-size="24" fill="#14213d" font-weight="700" text-anchor="start">16</text><text x="812" y="596" font-size="15" fill="#2b2f38" font-weight="400" text-anchor="start">auto-approved → HubSpot task + Slack alert in ~6 s</text><rect x="736" y="626" width="640" height="54" rx="10" fill="#ffffff" stroke="#e3e6ec" stroke-width="1"/><text x="760" y="662" font-size="24" fill="#14213d" font-weight="700" text-anchor="start">18</text><text x="812" y="660" font-size="15" fill="#2b2f38" font-weight="400" text-anchor="start">sent to review with exact risk evidence + rewrite</text><rect x="736" y="690" width="640" height="54" rx="10" fill="#ffffff" stroke="#e3e6ec" stroke-width="1"/><text x="760" y="726" font-size="24" fill="#14213d" font-weight="700" text-anchor="start">16</text><text x="812" y="724" font-size="15" fill="#2b2f38" font-weight="400" text-anchor="start">blocked (15 by Gatekeeper, 1 placeholder by Claude)</text><rect x="736" y="754" width="640" height="54" rx="10" fill="#ffffff" stroke="#e3e6ec" stroke-width="1"/><text x="760" y="790" font-size="24" fill="#14213d" font-weight="700" text-anchor="start">35</text><text x="812" y="788" font-size="15" fill="#2b2f38" font-weight="400" text-anchor="start">HubSpot tasks + 35 Slack alerts, 0 failures</text><text x="64" y="862" font-size="12" fill="#0f766e" font-weight="700" text-anchor="start" letter-spacing="1.5">BUSINESS VALUE</text><rect x="64" y="876" width="1312" height="96" rx="10" fill="#e6f4f2" stroke="#b7dfd9" stroke-width="1"/><text x="88" y="910.0" font-size="16" fill="#14213d" font-weight="500" text-anchor="start">50 variants routed for $0.16 of AI replaced ≈3.5 hours of manual handoff (≈$121 at $34.63/h) — a ~750× return per batch.</text><text x="88" y="933.2" font-size="16" fill="#14213d" font-weight="500" text-anchor="start">At 1,000 variants/day: ≈$95–135/month in Claude costs on the existing VPS; no new SaaS seats (free HubSpot, Slack, Sheets).</text><text x="64" y="1000" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">Time saved assumes 6 min manual handoff per variant (copy to CRM, write task, notify team). Costs measured from Claude usage tokens.</text></svg>